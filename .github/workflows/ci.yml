name: CI

# Checks only, no build: `pnpm build` runs loaders that need DATABASE_URL and
# a reachable Postgres, which CI deliberately does not have. Vercel is the
# build environment; this workflow is the fast gate in front of it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No `cache: pnpm` here: audit reads the lockfile without installing,
      # so the pnpm store never exists and the cache post-step would fail
      # the job after a successful audit.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Production dependencies at high or worse fail the PR. Dev-tree noise
      # is Dependabot's job, not a merge blocker.
      - run: pnpm audit --prod --audit-level high
